spring.application.name=loop-api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loop}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
server.port=${PORT:8080}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5500}
app.jwt-secret=${APP_JWT_SECRET}
app.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:180}
app.cookie-secure=${COOKIE_SECURE:false}
